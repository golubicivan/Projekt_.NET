<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="14" fill="#0a0a0a"/>
  <!-- zlatni pecat s nazubljenim rubom i prekrizanim gitarama (po uzoru na original) -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#c9a227" stroke-width="2.5" stroke-dasharray="2.5 2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#c9a227" stroke-width="2"/>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <defs>
    <path id="akTop" d="M 22 50 A 28 28 0 0 1 78 50"/>
    <path id="akBot" d="M 24 53 A 26 26 0 0 0 76 53"/>
  </defs>
  <text font-family="Georgia, serif" font-size="11" font-weight="700" fill="#c9a227" letter-spacing="1.5">
    <textPath href="#akTop" startOffset="50%" text-anchor="middle">ALKATRAZ</textPath>
  </text>
  <text font-family="Georgia, serif" font-size="9" font-weight="700" fill="#c9a227" letter-spacing="2">
    <textPath href="#akBot" startOffset="50%" text-anchor="middle">ROCK BAR</textPath>
  </text>
  <!-- prekrizane gitare -->
  <g stroke="#c9a227" fill="#c9a227">
    <g transform="rotate(40 50 50)">
      <line x1="50" y1="26" x2="50" y2="60" stroke-width="2.5"/>
      <rect x="47.7" y="24" width="4.6" height="6" rx="1"/>
      <ellipse cx="50" cy="63" rx="7.5" ry="9"/>
      <circle cx="50" cy="61" r="2.6" fill="#0a0a0a"/>
    </g>
    <g transform="rotate(-40 50 50)">
      <line x1="50" y1="26" x2="50" y2="60" stroke-width="2.5"/>
      <rect x="47.7" y="24" width="4.6" height="6" rx="1"/>
      <ellipse cx="50" cy="63" rx="7.5" ry="9"/>
      <circle cx="50" cy="61" r="2.6" fill="#0a0a0a"/>
    </g>
  </g>
  <text x="26" y="53" font-size="7" fill="#c9a227">&#9733;</text>
  <text x="69" y="53" font-size="7" fill="#c9a227">&#9733;</text>
</svg>
